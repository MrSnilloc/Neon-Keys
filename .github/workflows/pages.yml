# Publishes the tablet version of Neon Keys to GitHub Pages every time main changes.
# Only the app itself goes online: your Songs folder, Save folder and songs-library.js never do.
name: Publish Neon Keys

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect the app files
        run: |
          mkdir -p _site/icons
          cp NeonKeys.html manifest.webmanifest sw.js _site/
          cp icons/* _site/icons/
          # an empty song list: on the tablet you add songs with + ADD SONGS
          echo 'window.NEONKEYS_LIBRARY = [];' > _site/songs-library.js
          # so the short address .../Neon-Keys/ opens the game
          printf '<!doctype html><meta charset="utf-8"><title>Neon Keys</title><meta http-equiv="refresh" content="0;url=NeonKeys.html"><a href="NeonKeys.html">Open Neon Keys</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
